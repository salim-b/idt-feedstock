context:
  version: "0.1.23"

package:
  name: idt
  version: ${{ version }}

source:
  url: https://github.com/sh-cho/idt/archive/refs/tags/${{ version }}.tar.gz
  sha256: 79404c0aef153f350d2c2982641f42bc881fc597e58f92024382ee9f8c528cc4

build:
  number: 1
  script:
    env:
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_PROFILE_RELEASE_STRIP: symbols
    interpreter: nu
    content:
      - let prefix = $env.LIBRARY_PREFIX? | default $env.PREFIX
      # build main app and generate license data
      - cargo auditable install --path=. --root=($prefix) --no-track --locked --bins
      - cargo-bundle-licenses --format=yaml --output=THIRDPARTY.yml
      # generate shell completions
      - if: build_platform == host_platform
        then:
          - mkdir ($prefix)/share/man/man1 ($prefix)/share/bash-completion/completions ($prefix)/share/fish/vendor_completions.d ($prefix)/share/zsh/site-functions
          - let bin = ($prefix)/bin/idt
          - ^$bin manpage                 ($prefix)/share/man/man1
          - ^$bin completions bash | save ($prefix)/share/bash-completion/completions/idt
          - ^$bin completions fish | save ($prefix)/share/fish/vendor_completions.d/idt.fish
          - ^$bin completions zsh  | save ($prefix)/share/zsh/site-functions/_idt

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - cargo-auditable
    - cargo-bundle-licenses
    - nushell

tests:
  - script:
      - idt --help
      - idt --version
  - package_contents:
      bin:
        - idt
      files:
        - if: unix and build_platform == host_platform
          then:
            - share/man/man1/idt*.1
            - share/bash-completion/completions/idt
            - share/fish/vendor_completions.d/idt.fish
            - share/zsh/site-functions/_idt
        - if: win and build_platform == host_platform
          then:
            - Library/share/man/man1/idt*.1
            - Library/share/bash-completion/completions/idt
            - Library/share/fish/vendor_completions.d/idt.fish
            - Library/share/zsh/site-functions/_idt
      strict: true

about:
  summary: A fast, ergonomic CLI tool for working with various ID formats
  description: |
    idt (ID Tool) is a fast, ergonomic CLI tool for working with various
    identifier formats. Whether you need to generate, inspect, convert, or
    validate IDs, idt provides a unified interface for all your identifier needs
    including support for UUID (all versions), ULID, NanoID, Snowflake, assigned
    IDs (EAN, ISBN, ISIN), and more.
  license: MIT OR Apache-2.0
  license_file:
    - LICENSE-APACHE
    - LICENSE-MIT
    - THIRDPARTY.yml
  homepage: https://sh-cho.github.io/idt
  repository: https://github.com/sh-cho/idt

extra:
  recipe-maintainers:
    - salim-b
